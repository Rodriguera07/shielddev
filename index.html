<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>ShieldDev — Desenvolvimento Web de Alto Desempenho</title>
    <meta name="description" content="Rodrigo Dantas · ShieldDev. Sites, portfólios, landing pages e sistemas sob medida. Bertioga-SP." />
    <style>
      #preloader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
        background:radial-gradient(120% 90% at 70% 10%,#1a75b8 0%,#123f70 55%,#0c457b 100%);
        transition:opacity .6s cubic-bezier(.16,1,.3,1),visibility .6s cubic-bezier(.16,1,.3,1);}
      #preloader.pl-hide{opacity:0;visibility:hidden;pointer-events:none;}
      .preloader-inner{display:flex;flex-direction:column;align-items:center;gap:18px;}
      .preloader-logo-ring{position:relative;width:78px;height:78px;border-radius:50%;display:flex;
        align-items:center;justify-content:center;background:#fff;box-shadow:0 20px 50px -18px rgba(0,0,0,.5);}
      .preloader-logo-ring::before{content:"";position:absolute;inset:-10px;border-radius:50%;
        border:2px solid rgba(143,198,255,.3);border-top-color:#4f9dfa;animation:plSpin 1.1s linear infinite;}
      .preloader-logo-ring::after{content:"";position:absolute;inset:-24px;border-radius:50%;
        background:radial-gradient(circle,rgba(79,157,250,.35),transparent 70%);animation:plPulse 1.8s ease-in-out infinite;}
      .preloader-logo{width:44px;height:44px;object-fit:contain;position:relative;z-index:1;}
      @keyframes plSpin{to{transform:rotate(360deg);}}
      @keyframes plPulse{0%,100%{opacity:.5;transform:scale(.9);}50%{opacity:1;transform:scale(1.08);}}
      .preloader-brand{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
        font-size:19px;font-weight:600;letter-spacing:-.01em;color:#f3f7fc;}
      .preloader-brand span{color:#8fc6ff;}
      .preloader-status{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
        color:#93a6c2;display:flex;align-items:center;gap:2px;}
      .preloader-bracket{color:#4f9dfa;margin-right:4px;}
      .preloader-dots i{font-style:normal;animation:plDot 1.2s ease-in-out infinite;opacity:0;}
      .preloader-dots i:nth-child(2){animation-delay:.2s;}
      .preloader-dots i:nth-child(3){animation-delay:.4s;}
      @keyframes plDot{0%,100%{opacity:0;}50%{opacity:1;}}
      .preloader-bar{width:160px;height:3px;border-radius:9999px;background:rgba(255,255,255,.12);overflow:hidden;}
      .preloader-bar-fill{height:100%;width:40%;border-radius:9999px;background:linear-gradient(90deg,#8fc6ff,#2f7fe0);
        animation:plBar 1.3s ease-in-out infinite;}
      @keyframes plBar{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}
      @media(prefers-reduced-motion:reduce){
        #preloader{transition:opacity .01ms linear;}
        .preloader-logo-ring::before,.preloader-logo-ring::after,.preloader-dots i,.preloader-bar-fill{animation:none!important;}
        .preloader-bar-fill{width:70%;}
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-live="polite" aria-label="Carregando ShieldDev">
      <div class="preloader-inner">
        <div class="preloader-logo-ring">
          <img src="/favicon.png" alt="" class="preloader-logo" width="44" height="44" />
        </div>
        <div class="preloader-brand">Shield<span>Dev</span></div>
        <div class="preloader-status">
          <span class="preloader-bracket">&gt;</span>inicializando<span class="preloader-dots"><i>.</i><i>.</i><i>.</i></span>
        </div>
        <div class="preloader-bar"><div class="preloader-bar-fill"></div></div>
      </div>
    </div>
    <script>
      (function () {
        var pl = document.getElementById("preloader");
        if (!pl) return;
        var minTime = 650;
        var start = Date.now();
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          var wait = Math.max(0, minTime - (Date.now() - start));
          setTimeout(function () {
            pl.classList.add("pl-hide");
            setTimeout(function () { pl.remove(); }, 650);
          }, wait);
        }
        if (document.readyState === "complete") hide();
        else window.addEventListener("load", hide);
        setTimeout(hide, 4000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
